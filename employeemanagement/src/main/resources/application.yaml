spring:
  application:
    name: employeemanagement
  datasource:
    url: jdbc:h2:mem:employeedb
    driverClassName: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

jwt:
  # Replace this value with a long, random secret in every deployed environment.
  secret: change-this-development-secret-to-a-long-random-value-at-least-256-bits
  expiration-ms: 3600000
