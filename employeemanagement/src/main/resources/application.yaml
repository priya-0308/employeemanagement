spring:
  application:
    name: employeemanagement
  datasource:
    url: jdbc:h2:mem:employeedb
    driverClassName: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  server:
    port: 8081
springdoc:
  swagger-ui:
    path: /swagger-ui.html

jwt:
  # Replace this value with a long, random secret in every deployed environment.
  secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  expiration-ms: 3600000
